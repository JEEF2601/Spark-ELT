x-spark-jobs-service: &spark-jobs-service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      ETL_JOBS_GIT_URL: ${ETL_JOBS_GIT_URL:-https://github.com/JEEF2601/etl-jobs.git}
      ETL_JOBS_VERSION: ${ETL_JOBS_VERSION:-v0.3.0}
  image: spark-jobs:latest

services:
  spark-master:
    <<: *spark-jobs-service
    container_name: spark-master
    environment:
      - SPARK_MASTER_HOST=spark-master
    entrypoint: ["/opt/spark/entrypoint-master.sh"]
    ports:
      - '8180:8180'
      - '7077:7077'
      - '4040:4040'
    volumes:
      - './work:/opt/work'
      - './entrypoint-master.sh:/opt/spark/entrypoint-master.sh'
    networks:
      - etl_shared

  spark-worker-1:
    <<: *spark-jobs-service
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_LOCAL_HOSTNAME=spark-worker-1
      - SPARK_WORKER_OPTS=-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=600 -Dspark.worker.cleanup.appDataTtl=3600
    networks:
      - etl_shared

  spark-worker-2:
    <<: *spark-jobs-service
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_LOCAL_HOSTNAME=spark-worker-2
      - SPARK_WORKER_OPTS=-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=600 -Dspark.worker.cleanup.appDataTtl=3600
    networks:
      - etl_shared

  spark-jobs:
    <<: *spark-jobs-service
    container_name: spark-jobs
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    working_dir: /opt/spark-jobs
    ports:
      - "2222:2222"
    volumes:
      - /opt/spark/ssh/authorized_keys:/etc/ssh/authorized_keys/spark:ro
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      # R2 / Cloudflare
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_REGION=${R2_REGION:-auto}
      - R2_BUCKET=${R2_BUCKET}
      # InfluxDB
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT:-8086}
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE}
      - INFLUXDB_USERNAME=${INFLUXDB_USERNAME}
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD}
      - INFLUXDB_LOOKBACK=${INFLUXDB_LOOKBACK:-30d}
      # Spark
      - SPARK_JARS=${SPARK_JARS:-}
      - SPARK_PACKAGES=${SPARK_PACKAGES:-}
    command:
      - bash
      - -lc
      - |
        mkdir -p /run/sshd
        /usr/sbin/sshd
        exec tail -f /dev/null
    networks:
      - etl_shared

networks:
  etl_shared:
    name: etl_shared
