# Imagen base de workers y submitter construida desde este repositorio.
# Los workers usan la imagen custom para tener disponibles las dependencias Python
# cuando PySpark ejecuta transformaciones en los nodos.
x-spark-jobs-service: &spark-jobs-service
  build:
    context: .
    dockerfile: Dockerfile
    args:
      ETL_JOBS_GIT_URL: ${ETL_JOBS_GIT_URL:-https://github.com/JEEF2601/etl-jobs.git}
      ETL_JOBS_VERSION: ${ETL_JOBS_VERSION:-v0.2.0}
  image: spark-jobs:latest

services:
  spark-master:
    image: 'apache/spark:4.0.1-python3'
    container_name: spark-master
    environment:
      - SPARK_MASTER_HOST=spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - '--host'
      - spark-master
      - '--port'
      - '7077'
      - '--webui-port'
      - '8180'
    ports:
      - '8180:8180'
      - '7077:7077'
      - '4040:4040'
    volumes:
      - './work:/opt/work'
    networks:
      - etl_shared

  spark-worker-1:
    <<: *spark-jobs-service
    container_name: spark-worker-1
    depends_on:
      - spark-master
    environment:
      - SPARK_LOCAL_HOSTNAME=spark-worker-1
      - SPARK_WORKER_OPTS=-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=600 -Dspark.worker.cleanup.appDataTtl=3600
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - 'spark://spark-master:7077'
      - '--webui-port'
      - '8181'
    networks:
      - etl_shared

  spark-worker-2:
    <<: *spark-jobs-service
    container_name: spark-worker-2
    depends_on:
      - spark-master
    environment:
      - SPARK_LOCAL_HOSTNAME=spark-worker-2
      - SPARK_WORKER_OPTS=-Dspark.worker.cleanup.enabled=true -Dspark.worker.cleanup.interval=600 -Dspark.worker.cleanup.appDataTtl=3600
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - 'spark://spark-master:7077'
      - '--webui-port'
      - '8182'
    networks:
      - etl_shared

  # Servicio de submision de jobs. Ejecutar un job puntual:
  #   docker compose run --rm spark-jobs python jobs/influx_to_r2.py
  # O conectarse de forma interactiva:
  #   docker compose exec spark-jobs bash
  spark-jobs:
    <<: *spark-jobs-service
    container_name: spark-jobs
    depends_on:
      - spark-master
      - spark-worker-1
      - spark-worker-2
    working_dir: /opt/spark-jobs
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      # R2 / Cloudflare
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_REGION=${R2_REGION:-auto}
      - R2_BUCKET=${R2_BUCKET}
      # InfluxDB
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT:-8086}
      - INFLUXDB_DATABASE=${INFLUXDB_DATABASE}
      - INFLUXDB_USERNAME=${INFLUXDB_USERNAME}
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD}
      - INFLUXDB_LOOKBACK=${INFLUXDB_LOOKBACK:-30d}
      # Spark
      - SPARK_JARS=${SPARK_JARS:-}
      - SPARK_PACKAGES=${SPARK_PACKAGES:-}
    command: ["tail", "-f", "/dev/null"]
    networks:
      - etl_shared

networks:
  etl_shared:
    name: etl_shared
