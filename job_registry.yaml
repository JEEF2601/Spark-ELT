jobs:
  influx_to_r2:
    entrypoint: jobs/influx_to_r2.py
    description: Carga datos de InfluxDB hacia R2
    spark:
      executor_instances: 2
      executor_memory: 2g
      driver_memory: 1g
    params:
      - date
      - bucket

  cryptocompare_to_r2:
    entrypoint: jobs/cryptocompare_to_r2.py
    description: Carga datos de CryptoCompare hacia R2
    spark:
      executor_instances: 2
      executor_memory: 2g
      driver_memory: 1g
    params: []

  daily_aggregation:
    entrypoint: jobs/daily_aggregation.py
    description: Agregaciones diarias sobre datasets en R2
    spark:
      executor_instances: 2
      executor_memory: 2g
      driver_memory: 1g
    params:
      - date
